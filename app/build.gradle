android {
    namespace = "com.hakunaa.app"
    compileSdk = 36

    defaultConfig {
        // Do not change applicationId after a Play Store release.
        // It identifies the app on the device and in the store.
        applicationId = "com.hakunaa.app"
        // Lowest supported: Android 7.0 (API 24). FFmpegKit needs API 24,
        // so older phones cannot run the video engine. API 24+ covers
        // effectively every Android phone in use today.
        minSdk = 24
        // Latest: targets Android 16 (API 36), the newest stable Android.
        // Runs on newer Android versions too when they release.
        targetSdk = 36
        versionCode = 25
        versionName = "0.1.24"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        viewBinding = true
    }
}

dependencies {
    implementation("androidx.core:core-ktx:1.13.1")
    implementation("androidx.appcompat:appcompat:1.7.0")
    implementation("com.google.android.material:material:1.12.0")
    implementation("androidx.activity:activity-ktx:1.9.0")
    implementation("androidx.fragment:fragment-ktx:1.8.2")
    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.2")

    // Video: FFmpegKit full (maintained fork) — same engine as the
    // analysed reference app. libx264 / libx265, CRF + preset, AAC
    // audio. Native, on-device. This fork is 16 KB page-size aligned
    // (Google Play requirement since Nov 2025); the retired upstream
    // 6.0-2 was 4 KB only and would crash on 16 KB devices.
    // Same com.arthenica.ffmpegkit API — drop-in replacement.
    // Ships arm64-v8a + x86_64 only (no 32-bit); PDF and Image tools
    // are pure Kotlin/Java and still work on every phone.
    // MUST be full-GPL, not full: the non-GPL 'full' package has NO
    // libx264/libx265 (GPL encoders) — H.264 failed on-device with
    // "Unknown encoder 'libx264'". full-gpl has x264/x265/aom.
    // GPL-3.0 applies; the repo is public, so source stays available.
    implementation("dev.ffmpegkit-maintained:ffmpeg-kit-full-gpl:8.1.9")

    // PDF: Apache PDFBox on Android (merge, split, image to PDF).
    implementation("com.tom-roush:pdfbox-android:2.0.27.0")
}
